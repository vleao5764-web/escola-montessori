name: Publicar na Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publicar-matriculas-2027
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar matrículas 2027
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar pacote para a Hostinger
        run: |
          pnpm run package:hostinger
          node scripts/package-hostinger-flat.mjs

      - name: Enviar para o subdomínio
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./hostinger-flat/
          server-dir: /
          dangerous-clean-slate: false
